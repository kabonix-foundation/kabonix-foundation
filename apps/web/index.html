<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="website-url" content="/">
  <meta property="og:title" content="Kabonix Foundation — Digital Platform">
  <meta property="og:description" content="Staff and field officer portal for programme data collection and administration.">
  <meta property="og:image" content="./assets/logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="./assets/logo.png">
  <link rel="icon" href="./assets/logo.png" type="image/png">
  <title>Kabonix Foundation — Digital Platform</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Keep the portal as a real application: the logo is a contained mark,
       never a page-sized background or replacement for #root. */
    .login-visual {
      position: relative;
      overflow: hidden;
    }
    .login-visual::before {
      content: "";
      display: block;
      width: 156px;
      height: 156px;
      margin: 0 0 28px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.78);
      background: #fff url('./assets/logo.png') center / 132px 132px no-repeat;
      box-shadow: 0 12px 30px rgba(0,0,0,.16);
    }
    .login-visual .mark {
      margin-bottom: 28px;
    }
    .sb-logo {
      overflow: hidden;
      border-radius: 50%;
      background: #fff;
    }
    .sb-logo-img {
      object-fit: contain;
      background: #fff;
      padding: 4px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="app.js"></script>
</body>
</html>
