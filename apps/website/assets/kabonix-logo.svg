<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Kabonix Foundation logo</title>
  <desc id="logoDesc">Circular Kabonix Foundation emblem with a stylized white K, tree canopy, sun, and blue-green landscape above the Kabonix Foundation wordmark.</desc>
  <defs>
    <linearGradient id="greenCanopy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#91C93F"/><stop offset="1" stop-color="#4B9A3E"/></linearGradient>
    <linearGradient id="blueCanopy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#146C77"/><stop offset="1" stop-color="#07515E"/></linearGradient>
  </defs>

  <!-- Reference-matched emblem: centered, compact, and balanced inside the ring -->
  <circle cx="700" cy="370" r="314" fill="#fff" stroke="#087040" stroke-width="14"/>
  <clipPath id="badgeClip"><circle cx="700" cy="370" r="300"/></clipPath>
  <g clip-path="url(#badgeClip)">
    <!-- left green canopy -->
    <path fill="#006B3B" d="M375 510c-37-39-51-92-35-143 13-41 43-74 82-92 0-65 40-113 96-127 36-9 72-4 102 12 35-55 101-82 163-61 41 14 72 45 86 84 70-7 133 36 151 101 38 15 65 50 66 91 2 35-15 69-44 89 4 60-37 113-94 128-42 11-87 1-120-27-39 41-102 57-156 38-47-16-82-52-97-98-44 44-113 53-168 22-11-6-21-14-30-25z"/>
    <!-- lime upper canopy -->
    <path fill="url(#greenCanopy)" d="M434 246c40-64 108-96 176-83 51 10 92 43 112 88 27-6 56 3 75 25 20 23 25 54 14 82-54-6-102 7-142 37-49 37-78 93-82 158-68-18-125-65-154-129-27-59-26-124 1-178z"/>
    <!-- blue right landscape -->
    <path fill="url(#blueCanopy)" d="M741 276c52-38 121-44 180-13 49 26 79 74 82 128 42 21 70 65 69 113-1 54-37 102-88 117-54 16-108-3-141-43-35 16-76 16-112-2-34-17-59-48-67-86 6-86 34-158 77-214z"/>
    <!-- ground and trunk -->
    <path fill="#006B3B" d="M330 665c91-44 188-68 287-69 112-2 222 24 321 78v46H330z"/>
    <path fill="#0A5C56" d="M629 476c-36 69-40 137-12 205 14 34 36 62 68 84-70-21-119-71-134-135-15-65 9-126 78-154z"/>
    <!-- white K/tree silhouette, optically centered -->
    <path fill="#fff" d="M526 214h70v291l115-291h91L664 453l143 225h-95L596 509v169h-70V214z"/>
    <!-- sun -->
    <g transform="translate(760 358)" fill="#FFC51B" stroke="#FFC51B" stroke-linecap="round">
      <circle r="48" stroke="none"/>
      <path d="M0-82V-52M0 52V82M-82 0H-52M52 0H82M-58-58l21 21M58-58L37-37M-58 58l21-21M58 58L37 37" stroke-width="9"/>
    </g>
  </g>

  <!-- Reduced tracking and centered wordmark -->
  <text x="700" y="846" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="132" font-weight="800" letter-spacing="2" fill="#075867">KABONIX</text>
  <text x="700" y="950" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="500" letter-spacing="1" fill="#3D9147">FOUNDATION</text>
</svg>
