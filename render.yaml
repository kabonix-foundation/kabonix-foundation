services:
  - type: web
    name: kabonix-api
    runtime: node
    region: singapore
    plan: free
    rootDir: apps/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: DATABASE_URL
        fromDatabase:
          name: kabonix-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://kabonix-public.onrender.com

  - type: web
    runtime: static
    name: kabonix-staff
    buildCommand: >-
      sed -i
      's|http://localhost:4000/api|https://kabonix-api.onrender.com/api|g;
      s|http://localhost:3001|https://kabonix-public.onrender.com|g'
      app.js
    staticPublishPath: .
    rootDir: apps/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: static
    name: kabonix-public
    buildCommand: >-
      sed -i
      's|http://localhost:4000/api|https://kabonix-api.onrender.com/api|g;
      s|http://localhost:3000|https://kabonix-staff.onrender.com|g'
      index.html
    staticPublishPath: .
    rootDir: apps/website
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: kabonix-db
    plan: free
    region: singapore
